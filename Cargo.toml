[package]
name = "nu-mcp"
version = "0.8.1"
description = ""
edition = "2024"

[dependencies]
anyhow = "1.0.104"
nono = "0.80"
rmcp-macros = "3.5.1"
schemars = "1.2.3"
serde_json = "1.0.154"
tracing = "0.1.44"

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter"]

[dependencies.tokio]
version = "1.53.2"
features = ["full"]

[dependencies.rmcp]
version = "3.5.1"
features = [
    "server",
    "transport-io",
]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.clap]
version = "4.6.7"
features = ["derive"]

[dev-dependencies]
serial_test = "4.0.1"
tokio-util = "0.7.20"

[profile.coverage]
inherits = "test"
debug = "line-tables-only"
opt-level = 0
